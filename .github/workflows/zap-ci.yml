name: ZAP Python Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
#      - name: Start OWASP ZAP Daemon Container
#        run: |
#          docker run -d \
#            --name zap-daemon \
#            -p 8080:8080 \
#            ghcr.io/zaproxy/zaproxy:stable \
#            zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.disablekey=true
      - name: Start OWASP ZAP Daemon Container
        run: |
          docker run -d \
          --name zap-daemon \
          -p 8080:8080 \
          ghcr.io/zaproxy/zaproxy:stable \
          zap.sh -daemon \
          -host 0.0.0.0 \
          -port 8080 \
          -config api.disablekey=true \
          -config api.addrs.addr.name=.* \
          -config api.addrs.addr.regex=true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for ZAP to Initialize
        timeout-minutes: 2  # Fail fast after 2 minutes instead of hanging infinitely
        run: |
          echo "Waiting for ZAP API to become ready..."
          until curl -s http://localhost:8080/JSON/core/view/version/; do
            sleep 3
          done
          echo "ZAP is up and running!"

      - name: Dump ZAP Logs on Failure
        if: failure()
        run: docker logs zap-daemon

      - name: Run Security Automation Script
        run: python scripts/zap_saucedemo-security_test.py

      - name: Upload Security Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zap-html-security-report
          path: reports/zap_scan_report.html