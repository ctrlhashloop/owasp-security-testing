name: ZAP Python Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * 1' # Every Monday at 2 AM

jobs:
  security_scan:
    runs-on: ubuntu-latest

    # Spin up official OWASP ZAP as a background service container
    services:
      zap:
        image: ghcr.io/zaproxy/zaproxy:stable
        ports:
          - 8080:8080
        options: >-
          -t
          zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.disablekey=true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Security Automation Script
        run: python zap_saucedemo-security_test.py

      - name: Upload Security Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zap-html-security-report
          path: reports/zap_scan_report.html